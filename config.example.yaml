financial:
  # target_credit_min/max não filtram cotas individuais — servem só pra
  # achar combinações de 2-3 cotas que juntas caiam nessa faixa. O filtro
  # de crédito por cota individual é o de "modalities" mais abaixo.
  target_credit_min: 300000.00
  target_credit_max: 400000.00

  credit_basis: liquid
  fallback_to_nominal_credit: true

  max_entry_percentage: 0.15
  gold_entry_percentage: 0.10
  good_entry_percentage: 0.30

  # teto genérico, usado só como fallback quando a modalidade da cota não
  # é reconhecida (nem imóvel nem veículo)
  max_monthly_payment: 6000.00

  modalities:
    imovel:
      max_credit: 400000.00
      max_monthly_payment: 6000.00
    veiculo:
      min_credit: 20000.00
      max_credit: 200000.00
      max_monthly_payment: 2500.00

  combination:
    enabled: true
    minimum_quotas: 2
    maximum_quotas: 3
    maximum_results: 20
    require_same_administrator: true
    allow_unconfirmed_rules: true

  consistency:
    warning_difference_percentage: 0.15
    critical_difference_percentage: 0.35

monitoring:
  run_time: "08:00"
  timezone: "America/Recife"
  alert_if_last_success_older_than_hours: 30
  missing_runs_before_removed: 3
  minimum_snapshot_ratio: 0.50

sites:
  active:
    - contemplei
    - bidcon
    - prime_cotas
    - tramontana
    - franzotti
    - grupo_lume
    - bolsa_consorcio
    - compra_consorcios
    - vemcon
    - capitalizza

  policies:
    contemplei:
      collect: true
      alert: true
      transaction_status: conditional
      payment_protection: escrow_claimed
    bidcon:
      collect: true
      alert: true
      transaction_status: conditional
      payment_protection: escrow_claimed
    vemcon:
      collect: true
      alert: true
      transaction_status: conditional
      payment_protection: escrow_claimed
    capitalizza:
      collect: true
      alert: true
      transaction_status: research_only
      payment_protection: unknown
    prime_cotas: &research_only
      collect: true
      alert: true
      transaction_status: research_only
      payment_protection: none_confirmed
    tramontana: *research_only
    franzotti: *research_only
    grupo_lume: *research_only
    bolsa_consorcio: *research_only
    compra_consorcios: *research_only

evidence:
  keep_raw_json: true
  keep_html: true
  keep_screenshot: false
